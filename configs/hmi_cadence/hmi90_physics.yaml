path: "/glade/work/rjarolim/spinn_me/hmi_fd_20240323_2h_90s_physics_v01"
work_path: "/glade/derecho/scratch/rjarolim/hmi_fd_20240323_2h_90s_physics_v01"

data:
  train_configs:
    - type: hmi
      data_path: /glade/work/rjarolim/data/hmi_stokes/20240323_0100_0300_90s
      transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323_0100_0300
      stokes_normalization: 50000.0
      instrument_id: HMI
  valid_config:
    type: hmi
    data_path: /glade/work/rjarolim/data/hmi_stokes/20240323_0100_0300_90s
    sample_idx: 40
    transmission_profile_directory: /glade/work/rjarolim/data/hmi_calibration/20240323_0100_0300
    stokes_normalization: 50000.0
    instrument_id: HMI
    resolution: [256, 256]
  ref_time: '2024-03-23T00:59:23'
  num_workers: 4
  num_dataset_workers: 8
  batch_size: 8192
  dataset_batch_size: 512
  seconds_per_dt: 36000
  gauss_per_dB: 1000

instrument:
  - type: hmi
    instrument_id: HMI
    limb_correction: false

logging:
  project: spinnme
  name: hmi-90s-physics-v01
  mode: online

model:
  type: mlp
  dim: 512
  n_layers: 8
  vector_potential: false
  source_function: ratio
  activation: swish
  encoding_config:
    type: positional_isotropic
    num_frequencies: [256, 32]
    min_frequencies: [0, 0]
    max_frequencies: [12, 4]
    include_input: false

training:
  plot_validation: true
  epochs: -1
  check_val_every_n_epoch: null
  val_check_interval: 2000
  lr_params: {start: 0.001, end: 0.0001, iterations: 200000.0}
  optimizer_config: {type: soap}
  compile_config: {me_solver: true, mode: default}
  max_steps: 200000

normalization:
  asinh_alphas: null
  stokes_scales: {I: 1.0, Q: 0.1, U: 0.1, V: 0.1}

stokes_loss:
  type: mse
  continuum_normalization: true
  continuum_quantile: 0.9

weights: {I: 1.0, Q: 1.0, U: 1.0, V: 1.0}

# Keep the baseline direct-B model; enforce divergence-free and potential-field constraints as penalties.
physics:
  domain: full_train
  radius_range_Rs: [0.99, 1.01]
  num_points: 4096
  seed: 0
  radial_measure: volume
  normalization: characteristic
  epsilon: 1.0e-06
  characteristic_units:
    length_Mm: 10.0
    magnetic_field_G: 1000.0
    velocity_km_s: 1.0
    time_s: 1000.0
  constraints:
    divergence:
      type: exponential
      start: 1.0
      end: 1.0e-4
      iterations: 200000
    potential:
      type: exponential
      start: 1.0
      end: 1.0e-4
      iterations: 200000
